  <style>
    /* ===== ГЛОБАЛЬНЫЙ СБРОС ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    body {
      padding: 0 !important;
      margin: 0 !important;
      display: flex;
      flex-direction: column;
      background: #0a0a0f;
      overscroll-behavior: none;
    }
    
    body.flash { background: #ffffff !important; transition: 0s; }
    body.win { background: #0a1a0a; box-shadow: inset 0 0 100px #00aa0044; }

    /* ===== СТРАШНЫЙ ФОН ===== */
    #horror-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
      opacity: 0.12;
      background-size: cover;
      background-position: center;
      transition: all 1s ease;
      filter: blur(2px) brightness(0.4) contrast(1.2);
    }
    #horror-bg.active { opacity: 0.2; filter: blur(3px) brightness(0.3) contrast(1.4); }
    #horror-bg::after {
      content: '';
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, transparent 30%, #000000cc 100%);
      pointer-events: none;
    }

    /* ===== ИМЯ ===== */
    #name-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      display: flex; justify-content: center; align-items: center;
      z-index: 99999; flex-direction: column; gap: 20px;
      padding: 20px;
    }
    #name-overlay h2 { color: #ff4444; font-size: 2rem; text-shadow: 0 0 30px #ff0000; font-family: 'Courier New', monospace; text-align: center; }
    #name-overlay input { padding: 15px 30px; font-size: 1.5rem; background: #1a1a2e; border: 2px solid #ff444488; color: #fff; border-radius: 50px; text-align: center; font-family: 'Courier New', monospace; width: 100%; max-width: 300px; }
    #name-overlay button { padding: 15px 50px; font-size: 1.2rem; background: #ff2222; border: none; color: #fff; border-radius: 50px; cursor: pointer; font-family: 'Courier New', monospace; box-shadow: 0 0 30px #ff000066; transition: 0.3s; touch-action: manipulation; }
    #name-overlay button:active { transform: scale(0.95); }

    /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      z-index: 10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0a0f;
    }

    /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: rgba(15,15,26,0.92);
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
      min-height: 36px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 20;
    }
    #currency-display {
      display: flex; align-items: center; gap: 4px;
      color: #ffaa44; font-size: 0.75rem;
      font-family: 'Courier New', monospace;
    }
    #currency-display .coin { font-size: 0.85rem; }
    #currency-display .amount { font-weight: bold; color: #ffcc66; }
    #currency-display .premium { color: #ffd700; font-size: 0.85rem; }
    #top-actions {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    #top-actions button {
      background: rgba(22,22,42,0.8);
      border: 1px solid #2a2a4a;
      color: #b8bcd0;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.5rem;
      transition: 0.3s;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      touch-action: manipulation;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #top-actions button:active { transform: scale(0.92); }
    #top-actions button:hover { border-color: #ff8800; color: #ff8800; }

    #fullscreen-btn {
      background: rgba(22,22,42,0.8);
      border: 1px solid #2a2a4a;
      color: #b8bcd0;
      padding: 2px 6px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      transition: 0.3s;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      touch-action: manipulation;
      min-height: 24px;
      min-width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fullscreen-btn:active { transform: scale(0.92); }
    #fullscreen-btn svg {
      vertical-align: middle;
      display: inline-block;
      width: 14px;
      height: 14px;
    }

    #install-btn {
      background: rgba(34,197,94,0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.5rem;
      transition: 0.3s;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      touch-action: manipulation;
      display: none;
      white-space: nowrap;
      min-height: 24px;
    }
    #install-btn:active { transform: scale(0.92); }

    /* ===== СТАТИСТИКА ===== */
    #stats-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 2px 8px;
      font-size: 0.5rem;
      color: #4a4a5a;
      font-family: 'Courier New', monospace;
      flex-shrink: 0;
      background: rgba(10,10,20,0.3);
      border-bottom: 1px solid #1a1a2e;
    }
    #stats-bar .stat { display: flex; align-items: center; gap: 2px; }
    #stats-bar .stat .num { color: #ff6666; font-weight: bold; }
    #stats-bar .stat.win-stat .num { color: #44ff44; }

    /* ===== КОНТЕНТ (горизонтальный) ===== */
    #content-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 6px 6px 6px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #content-scroll::-webkit-scrollbar {
      width: 3px;
    }
    #content-scroll::-webkit-scrollbar-track {
      background: rgba(10,10,20,0.3);
    }
    #content-scroll::-webkit-scrollbar-thumb {
      background: #2a2a4a;
      border-radius: 10px;
    }

    /* ===== ГОРИЗОНТАЛЬНАЯ СЕТКА ===== */
    #content-container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 6px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      height: 100%;
    }

    /* ===== МАГАЗИН (горизонтальный компактный) ===== */
    #shop-section {
      background: rgba(15,15,26,0.85);
      border-radius: 10px;
      border: 1px solid #1a1a2e;
      padding: 8px 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    #shop-section .shop-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    #shop-section .shop-header h3 { color: #ffd700; font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 1px; }
    #shop-section .shop-header span { color: #ff8800; font-size: 0.45rem; }
    
    .shop-grid-main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 4px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
      align-content: start;
    }
    .shop-grid-main::-webkit-scrollbar {
      width: 3px;
    }
    .shop-grid-main::-webkit-scrollbar-thumb {
      background: #2a2a4a;
      border-radius: 10px;
    }

    .shop-item-main {
      background: rgba(10,10,20,0.6);
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 4px 6px;
      transition: 0.3s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
    }
    .shop-item-main:active { transform: scale(0.97); }
    .shop-item-main .item-emoji { font-size: 1rem; }
    .shop-item-main .item-info { width: 100%; }
    .shop-item-main .item-name { font-size: 0.5rem; color: #b8bcd0; }
    .shop-item-main .item-desc { font-size: 0.4rem; color: #4a4a6a; }
    .shop-item-main .item-price-block { width: 100%; }
    .shop-item-main .item-price { font-size: 0.55rem; color: #ffd700; font-weight: bold; }
    .shop-item-main .item-bonus { font-size: 0.4rem; color: #ffcc66; }
    .shop-item-main .buy-btn {
      background: #ffd700; border: none; color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.45rem;
      font-weight: bold;
      transition: 0.3s;
      width: 100%;
      touch-action: manipulation;
      margin-top: 1px;
    }
    .shop-item-main .buy-btn:active { transform: scale(0.92); }
    .shop-item-main .buy-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .shop-item-main .buy-btn.owned-btn { background: #44aa44; cursor: default; }
    .shop-item-main .discount-badge {
      position: absolute; top: -3px; right: -3px;
      background: #ff8800; color: #fff; font-size: 0.3rem;
      padding: 1px 4px; border-radius: 4px;
      font-weight: bold;
    }

    /* ===== ИСТОРИИ (горизонтальные) ===== */
    #stories-section {
      background: rgba(15,15,26,0.85);
      border-radius: 10px;
      border: 1px solid #1a1a2e;
      padding: 8px 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    #stories-section .stories-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
      flex-wrap: wrap;
      gap: 4px;
      flex-shrink: 0;
    }
    #stories-section .stories-header h3 { color: #6688ff; font-size: 0.7rem; font-family: 'Courier New', monospace; letter-spacing: 1px; }
    #stories-section .stories-header .count { color: #4a4a6a; font-size: 0.5rem; }
    
    #filter-buttons {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    #filter-buttons button {
      background: rgba(22,22,42,0.8);
      border: 1px solid #2a2a4a;
      color: #4a4a6a;
      padding: 1px 5px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 0.4rem;
      transition: 0.3s;
      touch-action: manipulation;
      min-height: 18px;
    }
    #filter-buttons button:active { transform: scale(0.92); }
    #filter-buttons button.active { border-color: #6688ff; color: #6688ff; }

    .stories-grid-main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 4px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
      align-content: start;
    }
    .stories-grid-main::-webkit-scrollbar {
      width: 3px;
    }
    .stories-grid-main::-webkit-scrollbar-thumb {
      background: #2a2a4a;
      border-radius: 10px;
    }

    .story-card-main {
      background: rgba(10,10,20,0.5);
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      padding: 4px 3px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      position: relative;
      min-height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .story-card-main:active { transform: scale(0.94); }
    .story-card-main .emoji { font-size: 0.9rem; display: block; }
    .story-card-main .title { font-size: 0.4rem; color: #b8bcd0; margin-top: 1px; line-height: 1.1; }
    .story-card-main .cat-name { font-size: 0.3rem; color: #4a4a6a; }
    .story-card-main .reward { font-size: 0.35rem; color: #ffd700; }
    .story-card-main .status {
      font-size: 0.35rem; margin-top: 1px;
    }
    .story-card-main .status.completed { color: #44ff44; }
    .story-card-main .status.locked { color: #ff4444; }
    .story-card-main .status.available { color: #6688ff; }
    .story-card-main .cat-tag { position: absolute; top: 1px; left: 3px; font-size: 0.3rem; opacity: 0.3; }

    .story-card-main.locked-card { opacity: 0.4; filter: grayscale(0.8); cursor: not-allowed; }
    .story-card-main.locked-card:active { transform: none; }
    .story-card-main.completed-card { border-color: #44aa44; }
    .story-card-main.completed-card .title::after { content: ' ✓'; color: #44aa44; }

    /* ===== ИГРОВОЙ ЭКРАН (горизонтальный) ===== */
    #game-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: -webkit-fill-available;
      z-index: 30;
      background: #0a0a0f;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden;
    }
    #game-screen.active { display: flex; flex-direction: column; }

    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(15,15,26,0.92);
      padding: 8px 12px 12px 12px;
      border: none;
      border-radius: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .game-container.win-border { box-shadow: inset 0 0 60px #00aa0066; }
    .game-container.premium-border { box-shadow: inset 0 0 60px #ffd70044; }

    #game-indicator {
      text-align: center;
      font-size: 0.5rem;
      color: #4a4a6a;
      padding-bottom: 4px;
      flex-shrink: 0;
      font-family: 'Courier New', monospace;
      border-bottom: 1px solid #1a1a2e;
    }
    #game-indicator .highlight { color: #ff6666; }
    #game-indicator .back-link { color: #6688ff; cursor: pointer; margin-left: 6px; touch-action: manipulation; }
    #game-indicator .back-link:active { opacity: 0.6; }

    h1 {
      font-size: 0.85rem;
      font-weight: 400;
      color: #ccd0e0;
      text-align: center;
      padding: 4px 0 2px 0;
      margin: 0;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      flex-shrink: 0;
      border-bottom: 1px dashed #2a2a3f;
    }
    h1.premium-title { color: #ffd700; text-shadow: 0 0 30px #ffd70044; }

    /* ===== ГОРИЗОНТАЛЬНАЯ ИГРА ===== */
    .scene-box {
      flex: 1;
      background: rgba(10,10,20,0.8);
      border-radius: 10px;
      padding: 8px 12px;
      box-shadow: inset 0 4px 20px #000000;
      border: 1px solid #1a1a2e;
      margin: 4px 0;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      min-height: 0;
      gap: 10px;
    }
    .scene-box > * { position: relative; z-index: 1; }

    #story-text {
      color: #c8ccdd;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 300;
      text-shadow: 0 1px 3px #000000;
      font-family: 'Courier New', monospace;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
      max-height: none;
    }
    #story-text::-webkit-scrollbar {
      width: 3px;
    }
    #story-text::-webkit-scrollbar-thumb {
      background: #2a2a4a;
      border-radius: 10px;
    }
    #story-text.shake { animation: textShake 0.05s infinite alternate; }
    @keyframes textShake { 0% { transform: translate(-2px, -1px); } 100% { transform: translate(2px, 1px); } }

    .choices-area {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
      min-width: 180px;
      max-width: 280px;
    }
    .choices-area::-webkit-scrollbar {
      width: 3px;
    }
    .choices-area::-webkit-scrollbar-thumb {
      background: #2a2a4a;
      border-radius: 10px;
    }

    .choice-btn {
      background: rgba(22,22,42,0.9);
      border: 1px solid #2a2a4a;
      color: #b8bcd0;
      padding: 0.35rem 0.6rem;
      border-radius: 1.5rem;
      font-size: 0.65rem;
      font-weight: 300;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #0a0a12;
      letter-spacing: 0.3px;
      line-height: 1.2;
      font-family: 'Courier New', monospace;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      touch-action: manipulation;
    }
    .choice-btn:active { transform: translateY(2px); box-shadow: 0 0px 0 #0a0a12; }
    .choice-btn.danger-option { border-color: #aa3333; background: #1a0a0a; color: #ff8888; box-shadow: 0 2px 0 #3f1111; }
    .choice-btn.win-option { border-color: #44aa44; background: #0a1a0a; color: #88ff88; box-shadow: 0 2px 0 #1a3f1a; }
    .choice-btn.final-btn { border-color: #aa88ff; background: #1a0a2a; color: #cc88ff; box-shadow: 0 2px 0 #3f1a5f; }

    .reset-area {
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      padding-top: 4px;
      flex-wrap: wrap;
    }
    #reset-btn, #back-menu-btn {
      background: rgba(22,22,42,0.9);
      border: 1px solid #2a2a4a;
      color: #b8bcd0;
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.55rem;
      font-weight: 300;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 0 #0a0a12;
      letter-spacing: 1px;
      font-family: 'Courier New', monospace;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      touch-action: manipulation;
    }
    #reset-btn:active, #back-menu-btn:active { transform: translateY(2px); box-shadow: 0 0px 0 #0a0a12; }

    /* ===== НОТИФИКАЦИЯ ===== */
    #notification {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: #1a0a0a;
      border: 2px solid #ff444488;
      padding: 10px 20px;
      border-radius: 12px;
      color: #ff8888;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;

      opacity: 0;

    /* ===== ШУМ ===== */

      background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 3px 3px;

    }
    #noise-overlay.active { opacity: 0.1; animation: noiseAnim 0.02s infinite; }
    @keyframes noiseAnim { 0% { background-position: 0 0; } 100% { background-position: 20px 40px; } }

    /* ===== ПЛАТЁЖНОЕ ОКНО ===== */
    #payment-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      display: none; justify-content: center; align-items: center;
      z-index: 99996; flex-direction: column; padding: 16px;
    }
    #payment-overlay.active { display: flex; }
    .payment-box {
      background: #16162a; border: 2px solid #ffd700;

    }
    .payment-box .payment-close { position: absolute; top: 6px; right: 14px; background: none; border: none; color: #4a4a6a; font-size: 1.1rem; cursor: pointer; font-family: 'Courier New', monospace; touch-action: manipulation; }
    .payment-box .payment-close:active { transform: scale(0.9); }
    .payment-box h3 { color: #ffd700; font-size: 1rem; text-align: center; margin-bottom: 12px; font-family: 'Courier New', monospace; }
    .payment-box .payment-item { text-align: center; color: #b8bcd0; font-size: 0.8rem; margin-bottom: 10px; }
    .payment-box .payment-item .emoji { font-size: 1.5rem; display: block; }
    .payment-box .payment-item .price { color: #ffd700; font-size: 1rem; }
    .payment-box .payment-form { display: flex; flex-direction: column; gap: 8px; }
    .payment-box .payment-form label { color: #4a4a6a; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; }
    .payment-box .payment-form input { background: #0a0a14; border: 1px solid #2a2a4a; border-radius: 6px; padding: 6px 10px; color: #fff; font-family: 'Courier New', monospace; font-size: 0.7rem; width: 100%; }
    .payment-box .payment-form input:focus { border-color: #ffd700; outline: none; }
    .payment-box .payment-form .row { display: flex; gap: 6px; }
    .payment-box .payment-form .row > * { flex: 1; }
    .payment-box .payment-submit { background: #ffd700; border: none; padding: 10px; border-radius: 8px; color: #000; font-weight: bold; font-size: 0.9rem; cursor: pointer; font-family: 'Courier New', monospace; margin-top: 6px; transition: 0.3s; touch-action: manipulation; }
    .payment-box .payment-submit:active { transform: scale(0.96); }
    .payment-box .payment-submit:disabled { opacity: 0.3; cursor: not-allowed; }
    .payment-box .payment-note { text-align: center; color: #4a4a6a; font-size: 0.5rem; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1a1a2a; }

    .payment-box .payment-status.success { color: #44ff44; }

    /* ===== АДАПТАЦИЯ ПОД МАЛЫЕ ЭКРАНЫ (горизонтальные) ===== */
    @media (max-width: 768px) {
      #top-bar { padding: 3px 8px; min-height: 30px; }

      #currency-display .premium { font-size: 0.7rem; }
      #top-actions button { font-size: 0.45rem; padding: 2px 6px; min-height: 20px; }
      #fullscreen-btn { padding: 2px 4px; min-height: 20px; min-width: 20px; }

      .scene-box { padding: 6px 10px; border-radius: 8px; margin: 3px 0; flex-direction: column; }
      #story-text { font-size: 0.7rem; line-height: 1.4; max-height: 40vh; }

    @media (max-width: 480px) {
      #content-container {
        grid-template-columns: 1fr 1.2fr;

      }

    }

    @media (max-width: 400px) {
      .shop-grid-main { grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); }
      .stories-grid-main { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); }
      #content-container { grid-template-columns: 1fr 1fr; gap: 2px; }
    }

    /* ===== УСТАНОВЛЕННОЕ ПРИЛОЖЕНИЕ ===== */
    @media (display-mode: standalone) {
      #top-bar { padding-top: 6px; }
    }

    /* ===== СКРЫТИЕ СКРОЛЛБАРА ===== */
    .no-scrollbar::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<!-- ОВЕРЛЕИ -->
<div id="noise-overlay"></div>

<script>
  (function() {
    // ============================================================
    // 0. БЛОКИРОВКА ОРИЕНТАЦИИ (горизонтальная)
    // ============================================================
    function lockOrientation() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.addEventListener('change', function() {
            if (screen.orientation.type.includes('portrait')) {
              screen.orientation.lock('landscape').catch(() => {});
            }
          });
        }
      } catch(e) {}
    }

    lockOrientation();

    // ============================================================
    // 1. PWA - УСТАНОВКА ПРИЛОЖЕНИЯ
    // ============================================================
    let deferredPrompt = null;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
      setTimeout(() => {
        showNotification('📲 Нажмите "УСТ" для установки', 'premium', 2500);
      }, 2000);
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          showNotification('✅ Приложение установлено!', 'win', 3000);
          installBtn.style.display = 'none';
        } else {
          showNotification('❌ Установка отменена', 'danger', 2000);
        }
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      showNotification('🎉 Приложение установлено!', 'win', 4000);
      installBtn.style.display = 'none';
    });

    // ============================================================
    // 2. ОСНОВНЫЕ ПАРАМЕТРЫ
    // ============================================================
    let playerName = '';
    let currentStoryId = 'story_0';
    let currency = 0;
    let premiumCurrency = 0;
    let completedStories = new Set();
    let deathCount = 0;
    let winCount = 0;
    let isPremium = false;
    let hasImmortality = false;
    let allStoriesUnlocked = false;
    let isSaleActive = true;
    let currentState = 'start';
    let isGameOver = false;
    let isWin = false;
    let currentFilter = 'all';
    let purchasedItems = new Set();

    // ============================================================
    // 3. ГЕНЕРАЦИЯ 100 ИСТОРИЙ
    // ============================================================
    function generate100Stories() {
      const stories = [];
      const categories = [
        { id: 'classic', emoji: '🏚️', name: 'Классика' },
        { id: 'psycho', emoji: '🧠', name: 'Психология' },
        { id: 'occult', emoji: '🕯️', name: 'Оккультизм' },
        { id: 'scifi', emoji: '🚀', name: 'Фантастика' },
        { id: 'theater', emoji: '🎭', name: 'Театр' },
        { id: 'gothic', emoji: '🏰', name: 'Готика' },
        { id: 'deep', emoji: '🌊', name: 'Глубины' },
        { id: 'travel', emoji: '🚂', name: 'Поездки' },
        { id: 'mystic', emoji: '🔮', name: 'Мистика' },
        { id: 'special', emoji: '🎮', name: 'Спец' }
      ];
      
      const titles = [
        'Тёмный лес', 'Заброшенный дом', 'Кладбище', 'Склеп', 'Подземелье',
        'Больница', 'Санаторий', 'Зеркальная комната', 'Театр марионеток',
        'Космический корабль', 'Подводная станция', 'Лаборатория',
        'Театр', 'Опера', 'Маскарад', 'Особняк', 'Замок',
        'Глубина', 'Кракен', 'Батискаф', 'Поезд', 'Самолёт', 'Корабль',
        'Комната предсказаний', 'Магия', 'Проклятие', 'Комната 131984'
      ];
      
      let id = 0;
      for (const cat of categories) {
        for (let i = 0; i < 10; i++) {
          const title = titles[(id + i) % titles.length];
          const emojis = ['🌲','🏚️','🪦','🕯️','🔮','🏥','🎭','🚀','🌊','🚂','🏰','👻','🪓','🗡️','📖','💀','🦇','🌙','🌀','⚰️'];
          const emoji = emojis[(id + i) % emojis.length];
          const reward = [60,70,80,90,100,110,120,130,140,150][Math.floor(Math.random() * 10)];
          stories.push({
            id: 'story_' + id,
            category: cat.id,
            categoryName: cat.name,
            categoryEmoji: cat.emoji,
            emoji: emoji,
            title: title + (i > 0 ? ' ' + (i + 1) : ''),
            desc: 'Страшная история #' + (id + 1),
            reward: reward,
            locked: (id >= 90) ? true : false,
            index: id
          });
          id++;
        }
      }
      return stories;
    }

    const allStories = generate100Stories();

    // ============================================================
    // 4. МАГАЗИН (упрощённый для горизонтали)
    // ============================================================
    const shopItems = [
      { id: 'currency_100', name: '100', desc: 'Базовый', price: 99, salePrice: 99, emoji: '🪙', type: 'currency', amount: 100, discount: 0 },
      { id: 'currency_300', name: '300', desc: '+10%', price: 249, salePrice: 211, emoji: '🪙', type: 'currency', amount: 330, discount: 15 },
      { id: 'currency_500', name: '500', desc: '+20%', price: 399, salePrice: 319, emoji: '🪙', type: 'currency', amount: 600, discount: 20 },
      { id: 'currency_1000', name: '1000', desc: '+30%', price: 699, salePrice: 524, emoji: '🪙', type: 'currency', amount: 1300, discount: 25 },
      { id: 'unlock_all', name: '🔓 Все', desc: 'Открыть все', price: 499, salePrice: 399, emoji: '🔑', type: 'unlock', discount: 20 },
      { id: 'immortality', name: '💀 Бессм.', desc: 'Бесконечные жизни', price: 999, salePrice: 799, emoji: '💀', type: 'immortality', discount: 20 },
      { id: 'premium_pass', name: '👑 Премиум', desc: 'ВСЁ СРАЗУ', price: 1999, salePrice: 1499, emoji: '👑', type: 'premium', discount: 25 }
    ];

    // ============================================================
    // 5. UI ЭЛЕМЕНТЫ
    // ============================================================
    const mainCurrency = document.getElementById('mainCurrency');
    const mainPremium = document.getElementById('mainPremium');
    const mainDeaths = document.getElementById('mainDeaths');
    const mainWins = document.getElementById('mainWins');
    const mainCompleted = document.getElementById('mainCompleted');
    const mainStoryCount = document.getElementById('mainStoryCount');
    const mainShopGrid = document.getElementById('mainShopGrid');
    const mainStoriesGrid = document.getElementById('mainStoriesGrid');
    const filterButtons = document.getElementById('filter-buttons');

    const gameStoryName = document.getElementById('gameStoryName');
    const gameTitle = document.getElementById('gameTitle');
    const storyText = document.getElementById('story-text');
    const choicesContainer = document.getElementById('choices-container');
    const container = document.getElementById('gameContainer');
    const notification = document.getElementById('notification');

    const resetBtn = document.getElementById('reset-btn');
    const backMenuBtn = document.getElementById('back-menu-btn');
    const gameBackLink = document.getElementById('gameBackLink');

    // ============================================================
    // 6. СОХРАНЕНИЕ
    // ============================================================
    function saveGame() {
      try {
        const saveData = {
          currency, premiumCurrency,
          completedStories: [...completedStories],
          deathCount, winCount, playerName,
          premiumStatus: { isPremium, hasImmortality, allStoriesUnlocked },
          purchasedItems: [...purchasedItems]
        };
        localStorage.setItem('h100_save', JSON.stringify(saveData));
      } catch(e) {}
    }

    function loadGame() {
      try {
        const saveData = localStorage.getItem('h100_save');
        if (saveData) {
          const parsed = JSON.parse(saveData);
          currency = parsed.currency || 0;
          premiumCurrency = parsed.premiumCurrency || 0;
          completedStories = new Set(parsed.completedStories || []);
          deathCount = parsed.deathCount || 0;
          winCount = parsed.winCount || 0;
          playerName = parsed.playerName || '';
          if (parsed.premiumStatus) {
            isPremium = parsed.premiumStatus.isPremium || false;
            hasImmortality = parsed.premiumStatus.hasImmortality || false;
            allStoriesUnlocked = parsed.premiumStatus.allStoriesUnlocked || false;
          }
          purchasedItems = new Set(parsed.purchasedItems || []);
        }
      } catch(e) {}
    }

    // ============================================================
    // 7. ОБНОВЛЕНИЕ UI
    // ============================================================
    function updateUI() {
      mainCurrency.textContent = currency;
      mainPremium.textContent = premiumCurrency;
      mainDeaths.textContent = deathCount;
      mainWins.textContent = winCount;
      mainCompleted.textContent = completedStories.size;
      mainStoryCount.textContent = completedStories.size + ' из 100';
      
      if (isPremium) {
        container.classList.add('premium-border');
        gameTitle.classList.add('premium-title');
      } else {
        container.classList.remove('premium-border');
        gameTitle.classList.remove('premium-title');
      }
      
      renderMainShop();
      renderAllStories();
      saveGame();
    }

    function showNotification(text, type = 'danger', duration = 2500) {
      notification.textContent = text;
      notification.className = 'active ' + type;
      clearTimeout(notification._timeout);
      notification._timeout = setTimeout(() => {
        notification.className = '';
      }, duration);
    }

    // ============================================================
    // 8. МАГАЗИН
    // ============================================================
    function isItemPurchased(item) { return purchasedItems.has(item.id); }
    function isItemActive(item) {
      switch (item.type) {
        case 'unlock': return allStoriesUnlocked;
        case 'immortality': return hasImmortality;
        case 'premium': return isPremium;
        default: return false;
      }
    }

    function renderMainShop() {
      mainShopGrid.innerHTML = '';
      for (const item of shopItems) {
        const div = document.createElement('div');
        div.className = 'shop-item-main';
        const price = isSaleActive ? item.salePrice : item.price;
        const hasDiscount = isSaleActive && item.discount > 0;
        
        let statusText = 'КУПИТЬ', disabled = false, ownedClass = '';
        if (item.type === 'currency') {
          if (isItemPurchased(item)) statusText = 'ЕЩЁ';
        } else if (isItemActive(item)) {
          statusText = '✅'; disabled = true; ownedClass = 'owned-btn';
        }
        
        div.innerHTML = `
          ${hasDiscount ? `<span class="discount-badge">-${item.discount}%</span>` : ''}
          <span class="item-emoji">${item.emoji}</span>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
          </div>
          <div class="item-price-block">
            <div class="item-price">
              ${hasDiscount ? `<span style="font-size:0.45rem;color:#ff4444;text-decoration:line-through;margin-right:2px;">${item.price}₽</span>` : ''}
              ${price}₽
            </div>
            ${item.type === 'currency' ? `<div class="item-bonus">+${item.amount}</div>` : ''}
            <button class="buy-btn ${ownedClass}" ${disabled ? 'disabled' : ''}>${statusText}</button>
          </div>
        `;
        const btn = div.querySelector('.buy-btn');
        if (!disabled) btn.addEventListener('click', (e) => { e.stopPropagation(); openPayment(item); });
        mainShopGrid.appendChild(div);
      }
    }

    // ============================================================
    // 9. ВСЕ ИСТОРИИ
    // ============================================================
    function renderAllStories() {
      mainStoriesGrid.innerHTML = '';
      let filtered = currentFilter === 'all' ? allStories : allStories.filter(s => s.category === currentFilter);
      
      for (const story of filtered) {
        const card = document.createElement('div');
        card.className = 'story-card-main';
        const isCompleted = completedStories.has(story.id);
        const isLocked = story.locked && !isCompleted && !allStoriesUnlocked;
        if (isCompleted) card.classList.add('completed-card');
        if (isLocked) card.classList.add('locked-card');
        
        let statusText = isCompleted ? '✅' : isLocked ? '🔒' : '▶️';
        card.innerHTML = `
          <span class="cat-tag">${story.categoryEmoji}</span>
          <span class="emoji">${story.emoji}</span>
          <div class="title">${story.title}</div>
          <div class="cat-name">${story.categoryName}</div>
          <div class="reward">💰${story.reward}</div>
          <div class="status ${isCompleted ? 'completed' : isLocked ? 'locked' : 'available'}">${statusText}</div>
        `;
        card.addEventListener('click', function() {
          if (isLocked) { showNotification('🔒 История заблокирована!', 'danger', 1500); return; }
          startStory(story.id);
        });
        mainStoriesGrid.appendChild(card);
      }
    }

    // ============================================================
    // 10. ЗАПУСК ИСТОРИИ
    // ============================================================
    function startStory(storyId) {
      currentStoryId = storyId;
      const story = allStories.find(s => s.id === storyId);
      if (!story) { showNotification('❌ История не найдена!', 'danger', 1500); return; }
      
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('game-screen').classList.add('active');
      
      gameStoryName.textContent = `${story.emoji} ${story.title}`;
      gameTitle.textContent = `${story.emoji} ${story.title}`;
      
      isGameOver = false; isWin = false; currentState = 'start';
      renderGameState('start');
      updateUI();
    }

    // ============================================================
    // 11. ГЕНЕРАЦИЯ СЦЕН (упрощённая для горизонтали)
    // ============================================================
    function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function generateLongStoryScenes(story) {
      const name = playerName || 'Ты';
      const title = story.title;
      
      const introTexts = [
        `Тишина давит. ${name}, ты на пороге ${title}. Воздух холодный и липкий. Где-то в глубине слышен странный звук.`,
        `Тьма сгущается вокруг тебя, ${name}. ${title} встречает мраком. Пахнет сыростью и гнилью.`,
        `${name}, ты в ${title}. Стены дышат. Ты слышишь шёпот, но не можешь разобрать слов.`
      ];

      const sceneTexts = {
        'start': introTexts[getRandomInt(0, introTexts.length - 1)] + '\n\nЧто будешь делать?',
        'scene_2': `${name}, шаг вперёд. Пол скрипит. Тьма густеет. Холодные пальцы касаются спины.`,
        'scene_3': `${name}, замираешь. Вдалеке слабый свет. Кто-то рядом дышит.`,
        'scene_4': `${name}, глубокий вдох. Тьма отступает. Это затишье.`,
        'scene_5': `${name}, коридор. Стены покрыты символами. Где-то смех.`,
        'scene_6': `${name}, тишина. Гробовая. Давит, пугает.`,
        'scene_7': `${name}, развилка. Три туннеля. От каждого веет холодом.`,
        'scene_8': `${name}, туннель сужается. Капли воды. Пахнет плесенью.`,
        'scene_9': `${name}, старая дверь. Покрыта паутиной. За дверью шёпот.`,
        'scene_10': `${name}, открываешь дверь. Огромный зал. Зеркало в центре. В отражении не ты.`,
        'scene_11': `${name}, силы покидают. Но ты не сдаёшься.`,
        'scene_12': `${name}, бежишь. Сзади топот. Ты видишь свет.`,
        'scene_fight': `${name}, ты вступаешь в схватку. Существо древнее и злое.`,
        'scene_light': `${name}, источник света. Старый фонарь. Свет разгоняет тьму.`,
        'scene_key': `${name}, старый ключ. Из чёрного металла. Пульсирует.`,
        'scene_trap': `${name}, ловушка. Тьма смыкается. Злобный смех.`,
        'scene_escape': `${name}, почти спасён. Свет в конце туннеля.`
      };

      const endings = {
        'ending_win1': { text: `🏆 ПОБЕДА 🏆\n\n${name}, ты прошёл ${title}! Тьма отступила.`, choices: [{ text: '📖 В меню', next: 'menu' }] },
        'ending_win2': { text: `🏆 ПОБЕДА 🏆\n\n${name}, ты победил! ${title} пал.`, choices: [{ text: '📖 В меню', next: 'menu' }] },
        'ending_lose1': { text: `💀 ПОРАЖЕНИЕ 💀\n\n${name}, тьма сильнее. ${title} поглотила тебя.`, choices: [{ text: '📖 В меню', next: 'menu' }] },
        'ending_lose2': { text: `💀 ПОРАЖЕНИЕ 💀\n\n${name}, ты исчез в ${title}.`, choices: [{ text: '📖 В меню', next: 'menu' }] }
      };

      const scenes = {
        'start': { text: sceneTexts['start'], choices: [
          { text: '🔦 Вперёд', next: 'scene_2' },
          { text: '🕯️ Осмотреться', next: 'scene_3' },
          { text: '🏃 Бежать', next: 'scene_4' },
          { text: '🔊 Крикнуть', next: 'scene_5' }
        ]},
        'scene_2': { text: sceneTexts['scene_2'], choices: [
          { text: '⚔️ В бой', next: 'scene_fight' },
          { text: '🔦 Свет', next: 'scene_light' },
          { text: '🔙 Назад', next: 'start' }
        ]},
        'scene_3': { text: sceneTexts['scene_3'], choices: [
          { text: '🔑 Ключ', next: 'scene_key' },
          { text: '🔦 На свет', next: 'scene_7' },
          { text: '🔙 Назад', next: 'start' }
        ]},
        'scene_4': { text: sceneTexts['scene_4'], choices: [
          { text: '🏃 Дальше', next: 'scene_12' },
          { text: '🛑 Прислушаться', next: 'scene_6' }
        ]},
        'scene_5': { text: sceneTexts['scene_5'], choices: [
          { text: '🔦 На смех', next: 'scene_8' },
          { text: '🔙 Убежать', next: 'scene_4' }
        ]},
        'scene_6': { text: sceneTexts['scene_6'], choices: [
          { text: '🔦 В тишину', next: 'scene_7' },
          { text: '⚔️ К бою', next: 'scene_fight' }
        ]},
        'scene_7': { text: sceneTexts['scene_7'], choices: [
          { text: '⬅️ Налево', next: 'scene_8' },
          { text: '➡️ Направо', next: 'scene_9' },
          { text: '⬆️ Прямо', next: 'scene_10' },
          { text: '🔙 Назад', next: 'start' }
        ]},
        'scene_8': { text: sceneTexts['scene_8'], choices: [
          { text: '🔑 Выход', next: 'scene_11' },
          { text: '🔦 Дальше', next: 'scene_10' }
        ]},
        'scene_9': { text: sceneTexts['scene_9'], choices: [
          { text: '🔑 Открыть', next: 'scene_10' },
          { text: '🔙 Уйти', next: 'scene_8' }
        ]},
        'scene_10': { text: sceneTexts['scene_10'], choices: [
          { text: '🪞 К зеркалу', next: 'scene_light' },
          { text: '⚔️ Разбить', next: 'scene_fight' }
        ]},
        'scene_11': { text: sceneTexts['scene_11'], choices: [
          { text: '🏃 К выходу', next: 'scene_12' },
          { text: '⚔️ Сражаться', next: 'scene_fight' }
        ]},
        'scene_12': { text: sceneTexts['scene_12'], choices: [
          { text: '🏃 К свету', next: 'ending_win1' },
          { text: '🛑 Остановиться', next: 'scene_trap' }
        ]},
        'scene_fight': { text: sceneTexts['scene_fight'], choices: [
          { text: '💀 До конца', next: 'ending_win2' },
          { text: '💀 Сдаться', next: 'ending_lose1' }
        ]},
        'scene_light': { text: sceneTexts['scene_light'], choices: [
          { text: '🏃 К свету', next: 'ending_win1' },
          { text: '🔙 В тьму', next: 'scene_7' }
        ]},
        'scene_key': { text: sceneTexts['scene_key'], choices: [
          { text: '🔑 Использовать', next: 'scene_10' },
          { text: '🔙 Уйти', next: 'scene_8' }
        ]},
        'scene_trap': { text: sceneTexts['scene_trap'], choices: [
          { text: '💀 Смириться', next: 'ending_lose2' },
          { text: '⚔️ Бороться', next: 'scene_fight' }
        ]}
      };

      Object.assign(scenes, endings);
      return scenes;
    }

    const storyCache = {};
    function getStoryScenes(story) {
      if (!storyCache[story.id]) storyCache[story.id] = generateLongStoryScenes(story);
      return storyCache[story.id];
    }

    // ============================================================
    // 12. ОТРИСОВКА ИГРЫ
    // ============================================================
    function renderGameState(stateId) {
      const story = allStories.find(s => s.id === currentStoryId);
      if (!story) { storyText.textContent = 'Ошибка'; choicesContainer.innerHTML = ''; return; }

      const scenes = getStoryScenes(story);
      const node = scenes[stateId];
      if (!node) { storyText.textContent = 'Ошибка'; choicesContainer.innerHTML = ''; return; }

      if (stateId === 'ending_win1' || stateId === 'ending_win2') {
        isWin = true; winCount++;
        if (!completedStories.has(story.id)) {
          const reward = story.reward || 80;
          currency += reward;
          showNotification(`🏆 +${reward} 💀`, 'win', 2500);
          completedStories.add(story.id);
        } else {
          showNotification(`🏆 Снова победа!`, 'win', 1500);
        }
        container.classList.add('win-border');
        updateUI(); saveGame();
      } else if (stateId.startsWith('ending_lose')) {
        isGameOver = true; deathCount++;
        showNotification(hasImmortality ? '💀 Амулет спас!' : '💀 Ты проиграл...', 
                        hasImmortality ? 'premium' : 'danger', 2000);
        updateUI(); saveGame();
      } else if (stateId === 'start') {
        isGameOver = false; isWin = false;
        container.classList.remove('win-border');
      }

      storyText.textContent = node.text;
      storyText.scrollTop = 0;
      choicesContainer.innerHTML = '';

      if (node.choices) {
        node.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          if (choice.text.includes('ПОБЕДА') || choice.text.includes('🏆')) btn.classList.add('win-option');
          if (choice.text.includes('КОНЕЦ') || choice.text.includes('💀')) btn.classList.add('danger-option');
          if (choice.next === 'menu' || choice.next.startsWith('ending_')) btn.classList.add('final-btn');
          btn.textContent = choice.text;
          btn.addEventListener('click', () => {
            if (choice.next === 'menu') { goToMainScreen(); return; }
            if (scenes[choice.next]) renderGameState(choice.next);
            else renderGameState('ending_lose1');
          });
          choicesContainer.appendChild(btn);
        });
      }
      updateUI();
    }

    // ============================================================
    // 13. ПЛАТЁЖНАЯ СИСТЕМА
    // ============================================================
    let currentPaymentItem = null;
    function openPayment(item) {
      currentPaymentItem = item;
      const price = isSaleActive ? item.salePrice : item.price;
      document.getElementById('paymentItem').innerHTML = `
        <span class="emoji">${item.emoji}</span>
        <div class="price">${price} ₽</div>
        <div style="font-size:0.6rem;opacity:0.5;">${item.name}</div>
      `;
      document.getElementById('paymentStatus').textContent = 'Заполните данные';
      document.getElementById('paymentStatus').className = 'payment-status';
      document.getElementById('cardNumber').value = '4242 4242 4242 4242';
      document.getElementById('cardExpiry').value = '12/26';
      document.getElementById('cardCvc').value = '123';
      document.getElementById('cardName').value = 'ИВАН ИВАНОВ';
      document.getElementById('payment-overlay').classList.add('active');
      document.getElementById('paymentSubmit').disabled = false;
    }

    function closePayment() {
      document.getElementById('payment-overlay').classList.remove('active');
      currentPaymentItem = null;
    }

    function processPayment() {
      const statusEl = document.getElementById('paymentStatus');
      statusEl.textContent = '⏳ Обработка...';
      statusEl.className = 'payment-status';
      document.getElementById('paymentSubmit').disabled = true;
      
      setTimeout(() => {
        statusEl.textContent = '✅ ПЛАТЁЖ ПРОВЕДЁН!';
        statusEl.className = 'payment-status success';
        if (currentPaymentItem) applyPurchase(currentPaymentItem);
        setTimeout(() => { closePayment(); document.getElementById('paymentSubmit').disabled = false; }, 1200);
      }, 1200);
    }

    function applyPurchase(item) {
      purchasedItems.add(item.id);
      switch (item.type) {
        case 'currency': currency += item.amount; premiumCurrency += Math.floor(item.price / 10); showNotification(`💰 +${item.amount} 💀`, 'premium', 2000); break;
        case 'unlock': allStoriesUnlocked = true; showNotification('🔓 ВСЕ ОТКРЫТЫ!', 'premium', 3000); break;
        case 'immortality': hasImmortality = true; showNotification('💀 БЕССМЕРТИЕ!', 'premium', 2500); break;
        case 'premium': isPremium = true; hasImmortality = true; allStoriesUnlocked = true; currency += 5000; premiumCurrency += 500; showNotification('👑 ПРЕМИУМ!', 'premium', 4000); break;
      }
      if (!localStorage.getItem('h100_first_purchase')) {
        currency += 50;
        localStorage.setItem('h100_first_purchase', 'true');
        showNotification('🎁 БОНУС +50 💀', 'premium', 2000);
      }
      updateUI(); saveGame();
    }

    // ============================================================
    // 14. НАВИГАЦИЯ
    // ============================================================
    function goToMainScreen() {
      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('app-container').style.display = 'flex';
      updateUI();
    }

    function resetGame() {
      const story = allStories.find(s => s.id === currentStoryId);
      if (story) { delete storyCache[story.id]; renderGameState('start'); }
      updateUI();
    }

    // ============================================================
    // 15. ФИЛЬТРЫ ИСТОРИЙ
    // ============================================================
    filterButtons.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        currentFilter = e.target.getAttribute('data-filter');
        filterButtons.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderAllStories();
      }
    });

    // ============================================================
    // 16. ПОЛНОЭКРАННЫЙ РЕЖИМ
    // ============================================================
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    let isFullscreenMode = false;

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => toggleCSSFullscreen());
      } else {
        document.exitFullscreen().catch(() => toggleCSSFullscreen());
      }
    }

    function toggleCSSFullscreen() {
      isFullscreenMode = !isFullscreenMode;
      document.body.classList.toggle('phone-fullscreen', isFullscreenMode);
      updateFullscreenIcon(isFullscreenMode);
      showNotification(isFullscreenMode ? '📱 Полноэкранный' : '📱 Обычный', 'premium', 1200);
    }

    function updateFullscreenIcon(isFullscreen) {
      fullscreenBtn.innerHTML = isFullscreen ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="10" y1="14" x2="3" y2="21"></line>
          <line x1="14" y1="10" x2="21" y2="3"></line>
        </svg>
      ` : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
      `;
    }

    document.addEventListener('fullscreenchange', () => {
      const fs = !!document.fullscreenElement;
      document.body.classList.toggle('phone-fullscreen', fs);
      updateFullscreenIcon(fs);
    });

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // ============================================================
    // 17. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    const nameOverlay = document.getElementById('name-overlay');
    const nameInput = document.getElementById('name-input');
    const nameSubmit = document.getElementById('name-submit');

    function enterGame(name) {
      playerName = name || 'Незнакомец';
      nameOverlay.style.display = 'none';
      loadGame();
      updateUI();
      document.getElementById('horror-bg').classList.add('active');
      showNotification(`👋 Добро пожаловать, ${playerName}!`, 'win', 2000);
    }

    nameSubmit.addEventListener('click', () => enterGame(nameInput.value.trim()));
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameSubmit.click(); });

    document.getElementById('paymentClose').addEventListener('click', closePayment);
    document.getElementById('paymentSubmit').addEventListener('click', processPayment);
    document.getElementById('payment-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closePayment(); });

    resetBtn.addEventListener('click', resetGame);
    backMenuBtn.addEventListener('click', goToMainScreen);
    gameBackLink.addEventListener('click', goToMainScreen);

    // ============================================================
    // 18. АВТОЗАПУСК
    // ============================================================
    loadGame();
    updateUI();

    if (playerName) {
      nameOverlay.style.display = 'none';
      document.getElementById('horror-bg').classList.add('active');
    }

    // Если приложение уже установлено (PWA)
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      setTimeout(() => {
        document.body.classList.add('phone-fullscreen');
        updateFullscreenIcon(true);
      }, 300);
    }

    // Блокируем ориентацию (повторно)
    setTimeout(lockOrientation, 500);

  })();
</script>
</body>
</html>
